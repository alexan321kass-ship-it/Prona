services:
  # Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    container_name: pronavid-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pronavid-network

networks:
  pronavid-network:
    name: pronavid-network
    external: true

volumes:
  postgres_data:
