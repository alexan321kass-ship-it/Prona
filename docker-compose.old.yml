services:
  # Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: pronavid-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    networks:
      - pronavid-network

  # Backend (NestJS)
  backend:
    build:
      context: ./backend-nest-js
      dockerfile: Dockerfile
    container_name: pronavid-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=nue6689@gmail.com
      - SMTP_PASS=xedljnwbugbybbxf
    depends_on:
      - db
    volumes:
      - ./backend-nest-js/uploads:/app/uploads
      - ./backend-nest-js/firebase-service-account.json:/app/firebase-service-account.json:ro
    networks:
      - pronavid-network

  # Frontend (Vite + Nginx Proxy)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: pronavid-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pronavid-network

networks:
  pronavid-network:
    driver: bridge

volumes:
  mysql_data:
